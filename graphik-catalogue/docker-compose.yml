version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: graphik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: graphik_catalogue
      POSTGRES_USER: graphik
      POSTGRES_PASSWORD: graphik_secret_2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: graphik_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: graphik_minio
      MINIO_ROOT_PASSWORD: graphik_minio_secret_2025
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
